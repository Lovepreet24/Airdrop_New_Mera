<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Galaxy - Earn Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0c1b] text-white min-h-screen flex flex-col items-center p-4">
    
    <div class="w-full max-w-md bg-[#1a1533] rounded-2xl p-6 shadow-xl border border-purple-900/50 mt-4 text-center">
        <h1 class="text-xl font-bold tracking-wider text-purple-300 mb-2">GALAXY EARN STUDIO</h1>
        
        <p class="text-xs text-gray-400 uppercase tracking-widest mt-4">Total Balance</p>
        <div id="balanceDisplay" class="text-4xl font-extrabold text-purple-200 my-2">500</div>
        <div class="text-sm text-green-400 font-medium mb-6">≈ $<span id="usdtDisplay">0.05</span> USDT</div>
        
        <!-- Task List -->
        <div class="space-y-3">
            <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30">
                <div class="text-left">
                    <p class="font-semibold text-sm">Watch Video #1</p>
                    <p class="text-xs text-purple-300">+100 GALAXY ($0.01)</p>
                </div>
                <button onclick="earnTokens(100)" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition">WATCH</button>
            </div>
            
            <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30">
                <div class="text-left">
                    <p class="font-semibold text-sm">Watch Video #2</p>
                    <p class="text-xs text-purple-300">+100 GALAXY ($0.01)</p>
                </div>
                <button onclick="earnTokens(100)" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition">WATCH</button>
            </div>
            
            <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30">
                <div class="text-left">
                    <p class="font-semibold text-sm">Watch Video #3</p>
                    <p class="text-xs text-purple-300">+100 GALAXY ($0.01)</p>
                </div>
                <button onclick="earnTokens(100)" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition">WATCH</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Telegram se User ID nikalna
        let userId = tg.initDataUnsafe?.user?.id;
        const urlParams = new URLSearchParams(window.location.search);
        if (!userId) {
            userId = urlParams.get('userid') || '123456789';
        }

        let currentBalance = parseInt(localStorage.getItem('galaxy_balance')) || 500;
        updateUI();

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = currentBalance;
            document.getElementById('usdtDisplay').innerText = (currentBalance * 0.0001).toFixed(2);
        }

        function earnTokens(amount) {
            currentBalance += amount;
            localStorage.setItem('galaxy_balance', currentBalance);
            updateUI();
            syncWithBackend(currentBalance);
        }

        async function syncWithBackend(newBalance) {
            try {
                let response = await fetch('https://usdtbot-production-89e9.up.railway.app/sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: userId, balance: newBalance })
                });
                let data = await response.json();
                console.log('Synced successfully:', data);
            } catch (error) {
                console.error('Error linking to Railway:', error);
            }
        }
        
        // App khulte hi automatic sync karega
        syncWithBackend(currentBalance);
    </script>
</body>
</html>
