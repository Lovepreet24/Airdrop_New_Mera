<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>USDT Galaxy - Earn Studio</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0f0c1b] text-white min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-[#1a1533] rounded-2xl p-6 shadow-xl border border-purple-900/50 mt-4 text-center">

        <h1 class="text-xl font-bold tracking-wider text-purple-300 mb-2">
            GALAXY EARN STUDIO
        </h1>

        <p class="text-xs text-gray-400 uppercase tracking-widest mt-4">
            Total Balance
        </p>

        <div
            id="balanceDisplay"
            class="text-4xl font-extrabold text-purple-200 my-2"
        >
            Loading...
        </div>

        <div class="text-sm text-green-400 font-medium mb-6">
            ≈ $<span id="usdtDisplay">0.00</span> USDT
        </div>


        <!-- ================= VIDEO 1 ================= -->

        <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30 mb-3">

            <div class="text-left">
                <p class="font-semibold text-sm">
                    Watch Video #1
                </p>

                <p class="text-xs text-purple-300">
                    +100 GALAXY ($0.01)
                </p>
            </div>

            <button
                onclick="watchYouTube(
                    'https://youtu.be/unTAEBvggus',
                    'video1',
                    this
                )"
                class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition"
            >
                WATCH
            </button>

        </div>


        <!-- ================= VIDEO 2 ================= -->

        <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30 mb-3">

            <div class="text-left">
                <p class="font-semibold text-sm">
                    Watch Video #2
                </p>

                <p class="text-xs text-purple-300">
                    +100 GALAXY ($0.01)
                </p>
            </div>

            <button
                onclick="watchYouTube(
                    'https://youtu.be/Hja_iwEkfmI',
                    'video2',
                    this
                )"
                class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition"
            >
                WATCH
            </button>

        </div>


        <!-- ================= VIDEO 3 ================= -->

        <div class="bg-[#241c4a] p-3 rounded-xl flex justify-between items-center border border-purple-800/30">

            <div class="text-left">
                <p class="font-semibold text-sm">
                    Watch Video #3
                </p>

                <p class="text-xs text-purple-300">
                    +100 GALAXY ($0.01)
                </p>
            </div>

            <button
                onclick="watchYouTube(
                    'https://youtu.be/I5mLBbsuAdA',
                    'video3',
                    this
                )"
                class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-xs font-bold transition"
            >
                WATCH
            </button>

        </div>

    </div>


<script>

/* =====================================================
   RAILWAY BACKEND
===================================================== */

const API =
    "https://usdtbot-production-89e9.up.railway.app";


/* =====================================================
   TELEGRAM MINI APP
===================================================== */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =====================================================
   BALANCE
===================================================== */

let currentBalance = 0;


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI() {

    document.getElementById(
        "balanceDisplay"
    ).innerText =
        currentBalance + " GALAXY";

    document.getElementById(
        "usdtDisplay"
    ).innerText =
        (currentBalance * 0.0001).toFixed(2);
}


/* =====================================================
   LOAD BALANCE FROM RAILWAY
===================================================== */

async function loadBalance() {

    console.log(
        "Telegram initData:",
        tg.initData
    );


    if (!tg.initData) {

        document.getElementById(
            "balanceDisplay"
        ).innerText =
            "Open in Telegram";

        return;
    }


    try {

        const response =
            await fetch(
                API + "/sync",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        initData:
                            tg.initData

                    })
                }
            );


        const responseText =
            await response.text();


        console.log(
            "SYNC status:",
            response.status
        );

        console.log(
            "SYNC response:",
            responseText
        );


        let data;

        try {

            data =
                JSON.parse(responseText);

        } catch {

            throw new Error(
                "Backend returned invalid response: " +
                responseText
            );
        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load balance"
            );
        }


        /*
         * Database balance only.
         */

        currentBalance =
            Number(data.balance) || 0;

        updateUI();


        console.log(
            "✅ Balance loaded:",
            currentBalance
        );


    } catch (error) {

        console.error(
            "❌ Balance loading error:",
            error
        );


        document.getElementById(
            "balanceDisplay"
        ).innerText =
            "ERROR";


        alert(
            "Balance error:\n\n" +
            error.message
        );
    }
}


/* =====================================================
   WATCH + EARN
===================================================== */

async function watchYouTube(
    videoUrl,
    taskId,
    button
) {

    /*
     * Prevent double click.
     */

    if (button.disabled) {
        return;
    }


    /*
     * Telegram check.
     */

    if (!tg.initData) {

        alert(
            "Telegram session missing.\n\n" +
            "Please open this Mini App from Telegram."
        );

        return;
    }


    /*
     * Disable button.
     */

    button.disabled = true;


    const originalText =
        button.innerText;


    button.innerText =
        "EARNING...";


    try {

        console.log(
            "Starting task:",
            taskId
        );


        /*
         * Send ONLY:
         *
         * initData
         * taskId
         *
         * Server decides reward.
         */

        const response =
            await fetch(
                API + "/earn",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        initData:
                            tg.initData,

                        taskId:
                            taskId

                    })
                }
            );


        const responseText =
            await response.text();


        console.log(
            "EARN status:",
            response.status
        );

        console.log(
            "EARN response:",
            responseText
        );


        let data;

        try {

            data =
                JSON.parse(responseText);

        } catch {

            throw new Error(
                "Backend response:\n" +
                responseText
            );
        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to add reward"
            );
        }


        /*
         * New balance returned
         * by Railway/Supabase.
         */

        currentBalance =
            Number(data.balance) || 0;

        updateUI();


        console.log(
            "✅ Reward added:",
            data.reward
        );

        console.log(
            "✅ New balance:",
            currentBalance
        );


        /*
         * Open YouTube after
         * successful reward.
         */

        window.open(
            videoUrl,
            "_blank"
        );


        /*
         * Confirmation.
         */

        alert(
            "+" +
            data.reward +
            " GALAXY added!\n\n" +
            "New balance: " +
            currentBalance +
            " GALAXY"
        );


    } catch (error) {

        console.error(
            "❌ Earn error:",
            error
        );


        alert(
            "Unable to add reward.\n\n" +
            error.message
        );


    } finally {

        button.disabled = false;

        button.innerText =
            originalText;
    }
}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadBalance();

</script>

</body>
</html>
