<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>USDT Galaxy</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    .card {
      background: linear-gradient(
        145deg,
        rgba(20, 25, 40, 0.95),
        rgba(8, 11, 20, 0.95)
      );
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .earn-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-weight: bold;
      background: #2563eb;
      margin-top: 10px;
    }

    .earn-btn:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="max-w-md mx-auto p-4">

    <div class="flex justify-between items-center mb-5">
      <div>
        <h1 class="text-2xl font-bold">🌌 USDT Galaxy</h1>
        <p class="text-gray-400 text-sm">
          Watch & Earn
        </p>
      </div>

      <div id="statusDot" class="text-green-400 text-sm">
        ● Online
      </div>
    </div>


    <!-- BALANCE -->

    <div class="card p-5 mb-5">

      <p class="text-gray-400 text-sm">
        Your Galaxy Balance
      </p>

      <div
        id="balance"
        class="text-4xl font-bold mt-2"
      >
        Loading...
      </div>

      <p class="text-gray-400 mt-2">
        GALAXY
      </p>

      <div
        id="usdtValue"
        class="text-green-400 mt-2"
      >
        ≈ $0.00 USDT
      </div>

    </div>


    <!-- TASKS -->

    <div class="card p-5">

      <h2 class="text-xl font-bold mb-1">
        🎬 Watch & Earn
      </h2>

      <p class="text-gray-400 text-sm mb-4">
        Watch the video and earn 100 GALAXY.
      </p>


      <!-- VIDEO 1 -->

      <div class="border border-gray-700 rounded-xl p-4 mb-4">

        <div class="font-bold">
          🎥 Galaxy Video #1
        </div>

        <div class="text-gray-400 text-sm mt-1">
          Reward: +100 GALAXY
        </div>

        <button
          id="video1Btn"
          class="earn-btn"
          onclick="watchYouTube(
            'https://youtu.be/unTAEBvggus',
            'video1',
            this
          )"
        >
          ▶️ Watch Video & Earn
        </button>

      </div>


      <!-- VIDEO 2 -->

      <div class="border border-gray-700 rounded-xl p-4 mb-4">

        <div class="font-bold">
          🎥 Galaxy Video #2
        </div>

        <div class="text-gray-400 text-sm mt-1">
          Reward: +100 GALAXY
        </div>

        <button
          id="video2Btn"
          class="earn-btn"
          onclick="watchYouTube(
            'https://youtu.be/Hja_iwEkfmI',
            'video2',
            this
          )"
        >
          ▶️ Watch Video & Earn
        </button>

      </div>


      <!-- VIDEO 3 -->

      <div class="border border-gray-700 rounded-xl p-4">

        <div class="font-bold">
          🎥 Galaxy Video #3
        </div>

        <div class="text-gray-400 text-sm mt-1">
          Reward: +100 GALAXY
        </div>

        <button
          id="video3Btn"
          class="earn-btn"
          onclick="watchYouTube(
            'https://youtu.be/I5mLBbsuAdA',
            'video3',
            this
          )"
        >
          ▶️ Watch Video & Earn
        </button>

      </div>

    </div>


    <!-- DEBUG -->

    <div
      id="debug"
      class="text-xs text-gray-500 mt-5 break-all"
    ></div>

  </div>


<script>

  // ==================================
  // CONFIG
  // ==================================

  const API =
    "https://usdtbot-production-89e9.up.railway.app";


  // ==================================
  // TELEGRAM
  // ==================================

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  // ==================================
  // ELEMENTS
  // ==================================

  const balanceElement =
    document.getElementById("balance");

  const usdtElement =
    document.getElementById("usdtValue");

  const debugElement =
    document.getElementById("debug");


  // ==================================
  // DEBUG INFO
  // ==================================

  function showDebug(message) {
    debugElement.innerText = message;
  }


  function telegramSessionAvailable() {

    return (
      tg &&
      typeof tg.initData === "string" &&
      tg.initData.length > 0
    );

  }


  // ==================================
  // UPDATE BALANCE UI
  // ==================================

  function updateBalance(balance) {

    const amount = Number(balance || 0);

    balanceElement.innerText =
      amount.toLocaleString();

    const usdt =
      (amount * 0.0001).toFixed(2);

    usdtElement.innerText =
      "≈ $" + usdt + " USDT";

  }


  // ==================================
  // LOAD BALANCE
  // ==================================

  async function loadBalance() {

    if (!telegramSessionAvailable()) {

      balanceElement.innerText =
        "Telegram Only";

      usdtElement.innerText =
        "Open this Mini App from the Telegram bot.";

      showDebug(
        "Telegram session missing. Open the app using the 🎬 Watch & Earn button inside @USDTGalaxyProRobot."
      );

      return;

    }


    showDebug(
      "Telegram session detected. Loading balance..."
    );


    try {

      const response =
        await fetch(API + "/sync", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: tg.initData
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        console.error(data);

        balanceElement.innerText =
          "Error";

        showDebug(
          "Server error: " +
          (data.error || response.status)
        );

        return;

      }


      if (!data.success) {

        balanceElement.innerText =
          "Error";

        showDebug(
          "Sync failed: " +
          (data.error || "Unknown error")
        );

        return;

      }


      updateBalance(data.balance);


      showDebug(
        "Balance synced successfully."
      );

    } catch (error) {

      console.error(error);

      balanceElement.innerText =
        "Offline";

      showDebug(
        "Backend connection failed."
      );

    }

  }


  // ==================================
  // WATCH YOUTUBE + EARN
  // ==================================

  async function watchYouTube(
    videoUrl,
    taskId,
    button
  ) {

    if (!telegramSessionAvailable()) {

      tg.showAlert(
        "Please open this Mini App from the Telegram bot."
      );

      return;

    }


    button.disabled = true;

    button.innerText =
      "⏳ Processing...";


    try {

      /*
       * First request reward from server.
       *
       * IMPORTANT:
       * The frontend does NOT send balance
       * or reward amount.
       */

      const response =
        await fetch(API + "/earn", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            initData: tg.initData,

            taskId: taskId

          })

        });


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.error || "Reward failed"
        );

      }


      // Update balance from server

      updateBalance(data.balance);


      // Open YouTube

      if (tg.openLink) {

        tg.openLink(videoUrl);

      } else {

        window.open(
          videoUrl,
          "_blank"
        );

      }


      button.innerText =
        "✅ Earned +100 GALAXY";


      showDebug(
        "Reward added successfully. New balance: " +
        data.balance
      );


    } catch (error) {

      console.error(error);

      button.disabled = false;

      button.innerText =
        "▶️ Watch Video & Earn";


      tg.showAlert(
        "Reward failed. Please try again."
      );


      showDebug(
        "Earn error: " + error.message
      );

    }

  }


  // ==================================
  // START
  // ==================================

  loadBalance();

</script>

</body>
</html>
