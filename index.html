<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Earn Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: radial-gradient(circle at top, #1b103f, #090614); color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; font-size: 24px; font-weight: bold; color: #9d4edd; }
        .balance-card { background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .balance-card h1 { margin: 10px 0; font-size: 42px; color: #e0aaff; }
        .usdt-value { font-size: 18px; color: #53f2c3; font-weight: bold; margin-bottom: 5px;}
        .task-container { display: flex; flex-direction: column; gap: 15px; }
        .task-card { background: #16102b; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d2154; }
        .task-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .task-info p { margin: 0; color: #e0aaff; font-size: 14px; font-weight: bold; }
        .watch-btn { background: #7b2cbf; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .watch-btn:disabled { background: #2a2245; color: #635787; }
    </style>
</head>
<body>
    <div class="header">🌌 GALAXY EARN STUDIO</div>
    <div class="balance-card">
        <p>TOTAL BALANCE</p>
        <h1 id="balance">500</h1>
        <div class="usdt-value" id="usdt-balance">≈ $0.05 USDT</div>
        <p>💫 GALAXY</p>
    </div>

    <h3 style="color: #c4b5fd; font-size: 16px; text-transform: uppercase;">📺 Daily Tasks (Refreshes in 1 min for testing)</h3>
    <div class="task-container" id="task-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        const userId = tg.initDataUnsafe?.user?.id; 

        let galaxyBalance = parseInt(localStorage.getItem('galaxy_balance')) || 500; 
        const usdtRate = 0.0001; 

        const videoPool = [
            { url: "https://youtu.be/_hzf9W746hk?si=7EkyntxrRJyMRNUA" },
            { url: "https://youtu.be/p3AlcT7qGGM?si=ehkyBtHuyYblyS9s" },
            { url: "https://youtu.be/CCDFnBjzbPM?si=SQP9MS-MCs7aofVG" },
            { url: "https://youtu.be/unTAEBvggus?si=7vD8UkvwIdN7VO03" },
            { url: "https://youtu.be/Hja_iwEkfmI?si=ZXUMVXyM17bBxfYU" },
            { url: "https://youtu.be/I5mLBbsuAdA?si=VH2iyck33TTyj7I_" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let lastResetTime = localStorage.getItem('last_reset_time');
        let currentTime = new Date().getTime();
        
        // 🔴 YAHAN CHANGE KIYA HAI: 24 ghante ki jagah 1 minute (60 * 1000 ms)
        if (!lastResetTime || (currentTime - lastResetTime > 60 * 1000)) {
            shuffleArray(videoPool);
            localStorage.setItem('todays_videos', JSON.stringify(videoPool.slice(0, 3)));
            localStorage.setItem('last_reset_time', currentTime);
            localStorage.setItem('completed_tasks', JSON.stringify([]));
        }

        let selectedVideos = JSON.parse(localStorage.getItem('todays_videos'));
        let completedTasks = JSON.parse(localStorage.getItem('completed_tasks')) || [];

        updateDisplay();
        const taskContainer = document.getElementById('task-container');
        
        selectedVideos.forEach((video, index) => {
            let taskId = index + 1; 
            let isDone = completedTasks.includes(taskId);

            taskContainer.innerHTML += `
                <div class="task-card">
                    <div class="task-info">
                        <h3>Watch Video #${taskId}</h3>
                        <p>+ 100 GALAXY ($0.01)</p>
                    </div>
                    <button class="watch-btn" id="btn${taskId}" onclick="startTask(${taskId}, '${video.url}', 100)" ${isDone ? 'disabled' : ''}>
                        ${isDone ? 'DONE' : 'WATCH'}
                    </button>
                </div>
            `;
        });

        function updateDisplay() {
            document.getElementById('balance').innerText = galaxyBalance;
            document.getElementById('usdt-balance').innerText = `≈ $${(galaxyBalance * usdtRate).toFixed(2)} USDT`;
            localStorage.setItem('galaxy_balance', galaxyBalance);
        }

        function startTask(taskId, videoUrl, reward) {
            tg.openLink(videoUrl);
            let btn = document.getElementById('btn' + taskId);
            btn.innerText = 'PLAYING...';
            btn.disabled = true;

            setTimeout(() => {
                galaxyBalance += reward;
                updateDisplay();
                completedTasks.push(taskId);
                localStorage.setItem('completed_tasks', JSON.stringify(completedTasks));

                btn.innerText = 'DONE';
                tg.HapticFeedback.notificationOccurred('success');

                if (userId) {
                    tg.showAlert('⏳ Syncing balance in background...'); 
                    
                    fetch('https://indexjs-production-3a24.up.railway.app/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: userId, balance: galaxyBalance })
                    })
                    .then(response => response.json())
                    .then(data => {
                        tg.showAlert('✅ Success! Bot me balance update ho gaya.');
                    })
                    .catch(err => {
                        tg.showAlert('❌ Server Error: ' + err.message); 
                    });
                } else {
                    tg.showAlert('⚠️ Error: User ID nahi mili! (Kripya app ko Bot ke button se kholen)');
                }

            }, 10000); 
        }
    </script>
</body>
</html>
