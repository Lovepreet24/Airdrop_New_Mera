<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Earn Bot</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle at top, #1b103f, #090614);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #9d4edd; 
            text-shadow: 0 0 10px rgba(157, 78, 221, 0.5);
        }
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .balance-card h1 { margin: 10px 0; font-size: 42px; color: #e0aaff; }
        .balance-card p { margin: 0; color: #a19bb5; font-size: 14px; letter-spacing: 1px; }
        
        .task-container { display: flex; flex-direction: column; gap: 15px; }
        
        .task-card {
            background: linear-gradient(145deg, #16102b, #1f163b);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d2154;
        }
        .task-info h3 { margin: 0 0 6px 0; font-size: 16px; font-weight: 600; }
        .task-info p { margin: 0; color: #e0aaff; font-size: 14px; font-weight: bold; }
        
        .watch-btn {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(123, 44, 191, 0.4);
        }
        .watch-btn:active { transform: scale(0.95); }
        .watch-btn:disabled {
            background: #2a2245;
            color: #635787;
            box-shadow: none;
            cursor: not-allowed;
        }
        h3.section-title { margin-bottom: 15px; color: #c4b5fd; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>

    <div class="header">🌌 GALAXY EARN BOT</div>

    <div class="balance-card">
        <p>TOTAL BALANCE</p>
        <h1 id="balance">0</h1>
        <p>💫 GALAXY</p>
    </div>

    <h3 class="section-title">📺 Watch Ads & Earn</h3>
    
    <div class="task-container">
        <!-- Task 1 -->
        <div class="task-card">
            <div class="task-info">
                <h3>Watch Video #1</h3>
                <p>+ 100 GALAXY</p>
            </div>
            <button class="watch-btn" id="btn1" onclick="startTask(1, 'https://youtube.com', 100)">WATCH</button>
        </div>

        <!-- Task 2 -->
        <div class="task-card">
            <div class="task-info">
                <h3>Watch Video #2</h3>
                <p>+ 100 GALAXY</p>
            </div>
            <button class="watch-btn" id="btn2" onclick="startTask(2, 'https://youtube.com', 100)">WATCH</button>
        </div>

        <!-- Task 3 -->
        <div class="task-card">
            <div class="task-info">
                <h3>Watch Video #3</h3>
                <p>+ 100 GALAXY</p>
            </div>
            <button class="watch-btn" id="btn3" onclick="startTask(3, 'https://youtube.com', 100)">WATCH</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let currentBalance = 0;

        function startTask(taskId, videoUrl, reward) {
            tg.openLink(videoUrl);
            
            let btn = document.getElementById('btn' + taskId);
            btn.innerText = 'PLAYING...';
            btn.disabled = true;

            setTimeout(() => {
                currentBalance += reward;
                document.getElementById('balance').innerText = currentBalance;
                btn.innerText = 'DONE';
                tg.HapticFeedback.notificationOccurred('success');
            }, 15000); 
        }
    </script>
</body>
</html>
